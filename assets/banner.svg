<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Purple glow filter -->
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Large ambient glow -->
    <filter id="glow-big" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
    <!-- Glass panel gradient -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </linearGradient>
    <!-- Border gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Chip gradient -->
    <linearGradient id="chip-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="#0d1117"/>

  <!-- Subtle grid pattern -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="420" y1="0" x2="420" y2="240"/>
    <line x1="480" y1="0" x2="480" y2="240"/>
    <line x1="540" y1="0" x2="540" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="660" y1="0" x2="660" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
    <line x1="780" y1="0" x2="780" y2="240"/>
    <line x1="840" y1="0" x2="840" y2="240"/>
  </g>

  <!-- Circuit trace accents -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.08" fill="none">
    <path d="M0 80 H120 V120 H240 V80 H300"/>
    <path d="M600 160 H720 V120 H840 V160 H900"/>
    <path d="M180 200 H240 V160 H360"/>
    <path d="M660 40 H720 V80 H780"/>
  </g>
  <g fill="#38bdf8" opacity="0.12">
    <circle cx="120" cy="80" r="2"/>
    <circle cx="240" cy="120" r="2"/>
    <circle cx="300" cy="80" r="2"/>
    <circle cx="720" cy="160" r="2"/>
    <circle cx="840" cy="120" r="2"/>
    <circle cx="240" cy="200" r="2"/>
    <circle cx="360" cy="160" r="2"/>
    <circle cx="720" cy="40" r="2"/>
    <circle cx="780" cy="80" r="2"/>
  </g>

  <!-- Ambient glow orbs -->
  <ellipse cx="350" cy="120" rx="200" ry="100" fill="#38bdf8" opacity="0.04" filter="url(#glow-big)"/>
  <ellipse cx="600" cy="100" rx="150" ry="80" fill="#818cf8" opacity="0.035" filter="url(#glow-big)"/>

  <!-- Glass panel -->
  <rect x="60" y="30" width="780" height="180" rx="16" fill="url(#glass)"/>
  <rect x="60" y="30" width="780" height="180" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1"/>

  <!-- Decorative corner marks -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.3">
    <path d="M76 34 H68 V46" fill="none"/>
    <path d="M824 34 H832 V46" fill="none"/>
    <path d="M76 206 H68 V194" fill="none"/>
    <path d="M824 206 H832 V194" fill="none"/>
  </g>

  <!-- Left accent bar -->
  <rect x="90" y="65" width="3" height="110" rx="1.5" fill="#38bdf8" opacity="0.4" filter="url(#glow-cyan)"/>

  <!-- Main title: KINJAZ HUB -->
  <text x="450" y="118" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="52" fill="#e2e8f0" letter-spacing="8" filter="url(#glow-cyan)">KINJAZ HUB</text>
  <!-- Title glow layer -->
  <text x="450" y="118" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="52" fill="#38bdf8" letter-spacing="8" opacity="0.15">KINJAZ HUB</text>

  <!-- Subtitle -->
  <text x="450" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#818cf8" letter-spacing="4" opacity="0.8">PREMIUM ROBLOX SCRIPT HUB</text>

  <!-- Divider line -->
  <line x1="320" y1="165" x2="580" y2="165" stroke="#38bdf8" stroke-width="0.5" opacity="0.2"/>

  <!-- ENCRYPTED status chip -->
  <rect x="383" y="174" width="134" height="26" rx="13" fill="url(#chip-grad)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="401" cy="187" r="3" fill="#38bdf8" opacity="0.9"/>
  <text x="450" y="192" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="3" opacity="0.9">ENCRYPTED</text>

  <!-- Top-right decorative hex dots -->
  <g fill="#818cf8" opacity="0.1">
    <circle cx="760" cy="55" r="1.5"/>
    <circle cx="775" cy="55" r="1.5"/>
    <circle cx="790" cy="55" r="1.5"/>
    <circle cx="767" cy="67" r="1.5"/>
    <circle cx="782" cy="67" r="1.5"/>
  </g>
</svg>